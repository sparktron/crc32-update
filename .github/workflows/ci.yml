name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffolding:
    name: Validate experiment scaffolding
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            SPEC.md
            PLAN.md
            STATUS.md
            results/search_log.jsonl
          )

          for required_file in "${required_files[@]}"; do
            test -f "${required_file}" || {
              echo "Missing required file: ${required_file}" >&2
              exit 1
            }
          done

      - name: Reject trailing whitespace
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nI -E '[[:blank:]]+$' -- .; then
            echo "Trailing whitespace found." >&2
            exit 1
          fi

      - name: Validate optimization search log
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("results/search_log.jsonl")
          required_fields = {
              "timestamp_utc",
              "attempt_id",
              "algorithm",
              "parameters",
              "seed",
              "runtime_seconds",
              "starting_metrics",
              "final_metrics",
              "verification_passed",
              "accepted",
              "rejection_reason",
              "artifact",
          }
          attempt_ids = set()

          for line_number, raw_line in enumerate(path.read_text().splitlines(), 1):
              if not raw_line.strip():
                  raise SystemExit(f"{path}:{line_number}: blank JSONL record")

              try:
                  record = json.loads(raw_line)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"{path}:{line_number}: {error}") from error

              if not isinstance(record, dict):
                  raise SystemExit(f"{path}:{line_number}: record must be an object")

              missing_fields = sorted(required_fields - record.keys())
              if missing_fields:
                  missing = ", ".join(missing_fields)
                  raise SystemExit(
                      f"{path}:{line_number}: missing required fields: {missing}"
                  )

              attempt_id = record["attempt_id"]
              if not isinstance(attempt_id, str) or not attempt_id:
                  raise SystemExit(
                      f"{path}:{line_number}: attempt_id must be a nonempty string"
                  )
              if attempt_id in attempt_ids:
                  raise SystemExit(
                      f"{path}:{line_number}: duplicate attempt_id: {attempt_id}"
                  )
              attempt_ids.add(attempt_id)

              if not isinstance(record["parameters"], dict):
                  raise SystemExit(
                      f"{path}:{line_number}: parameters must be an object"
                  )
              if type(record["verification_passed"]) is not bool:
                  raise SystemExit(
                      f"{path}:{line_number}: verification_passed must be boolean"
                  )
              if type(record["accepted"]) is not bool:
                  raise SystemExit(
                      f"{path}:{line_number}: accepted must be boolean"
                  )
              if not record["accepted"] and not record["rejection_reason"]:
                  raise SystemExit(
                      f"{path}:{line_number}: rejected attempt needs a reason"
                  )

          print(f"Validated {len(attempt_ids)} optimization attempt record(s).")
          PY

      - name: Install formal verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys z3

      - name: Check generated Phase 1 structural reference
        shell: bash
        run: |
          set -euo pipefail
          python3 -m generator.build_matrix \
            --matrix-output /tmp/crc32_matrix.json \
            --network-output /tmp/valid_crc32_network.v
          cmp verifier/fixtures/valid_crc32_network.v \
            /tmp/valid_crc32_network.v

      - name: Run Phase 1 unit and rejection tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            verifier.test_verifier \
            generator.test_baseline_generator \
            optimizer.test_optimize

      - name: Run Phase 1 acceptance verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m verifier.verify_network \
            verifier/fixtures/valid_crc32_network.v \
            --random-tests 100000 \
            --seed 0xC32A5EED \
            --output /tmp/phase1_verification.json
          python3 -m json.tool /tmp/phase1_verification.json

      - name: Run formal equivalence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m verifier.run_formal \
            verifier/fixtures/valid_crc32_network.v \
            --module crc32_network

      - name: Regenerate deterministic baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 -m generator.baseline_generator \
            --output-dir /tmp/generated_baselines \
            --timings-output /tmp/baseline_generation_timings.json
          cmp results/baselines/independent_per_output.v \
            /tmp/generated_baselines/independent_per_output.v
          cmp results/baselines/balanced_per_output.v \
            /tmp/generated_baselines/balanced_per_output.v
          cmp results/baselines/greedy_cse.v \
            /tmp/generated_baselines/greedy_cse.v

      - name: Verify and measure generated baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 -m verifier.verify_baselines \
            --baselines-dir /tmp/generated_baselines \
            --generation-timings /tmp/baseline_generation_timings.json \
            --metrics-output /tmp/baseline_metrics.csv \
            --random-tests 100000 \
            --seed 0xC32A5EED

      - name: Reproduce Candidate A from its recorded seed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m optimizer.optimize \
            --replay-frontier results/pareto_frontier.json \
            --artifact /tmp/candidate_a_min_area.v
          cmp results/candidate_a_min_area.v \
            /tmp/candidate_a_min_area.v

      - name: Verify Candidate A and result records
        shell: bash
        run: |
          set -euo pipefail
          python3 -m verifier.verify_candidate \
            --candidate results/candidate_a_min_area.v \
            --frontier results/pareto_frontier.json \
            --metrics results/metrics.csv \
            --random-tests 100000 \
            --seed 0xC32A5EED
